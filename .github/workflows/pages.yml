name: Deploy Audit Viewer

on:
  push:
    branches: [main]
    paths:
      - "artifacts/index.html"
      - "evidence/zetaris-live-receipt.json"
      - "evidence/meterless-hmem-runtime/ledger.jsonl"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        run: |
          mkdir -p _site/artifacts _site/evidence/meterless-hmem-runtime
          cp artifacts/index.html _site/index.html
          cp artifacts/index.html _site/artifacts/index.html
          cp evidence/zetaris-live-receipt.json _site/evidence/zetaris-live-receipt.json
          cp evidence/meterless-hmem-runtime/ledger.jsonl _site/evidence/meterless-hmem-runtime/ledger.jsonl
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
