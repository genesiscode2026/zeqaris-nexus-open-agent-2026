[package]
name = "zeqaris_canister"
version = "0.1.0"
edition = "2021"
description = "ZEQARIS NEXUS — ICP Threshold-ECDSA Verification & State Machine Canister"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "=0.10.39"
ic-cdk = "=0.13.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
hex = "=0.4.3"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "sha256"] }
